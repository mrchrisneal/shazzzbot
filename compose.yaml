name: shazzzbot
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
services:
  shazzzbot:
    build: .
    image: shazzzbot:dev
    labels: {org.shazzzbot.install: "${SHAZZZBOT_INSTALL_ID:?run setup.sh}"}
    environment:
      SHAZZZBOT_ROLE: bot
    env_file: .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ${EMHTTP_DIR:-/var/local/emhttp}:/host/emhttp:ro
      - ./config.toml:/config/config.toml:ro
      - ./data:/data
      - type: bind
        source: ${HELPER_SOCKET_DIR:?set the helper work socket directory}
        target: /run/shazzzbot-helper
        read_only: true
        bind:
          create_host_path: true
    group_add: ["${HELPER_GID:-10001}"]
    depends_on: [docker-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    logging: *logging
    restart: unless-stopped
  docker-proxy:
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    labels: {org.shazzzbot.install: "${SHAZZZBOT_INSTALL_ID:?run setup.sh}"}
    user: "0"
    volumes:
      - ./docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${SHAZZZBOT_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
    restart: unless-stopped

networks:
  default:
    name: shazzzbot_default
    labels: {org.shazzzbot.install: "${SHAZZZBOT_INSTALL_ID:?run setup.sh}"}
