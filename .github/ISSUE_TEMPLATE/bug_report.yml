name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you continue, read [Troubleshooting](https://github.com/mrchrisneal/shazzzbot/wiki/Troubleshooting).
        Remove tokens, keys, passwords, Discord ids, host names, and IP addresses from everything you paste.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I run the latest release.
          required: true
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I removed all secrets and private details from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: Shazzzbot version
      description: Run `/about` in Discord, or read the footer of the status panel.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: unraid
    attributes:
      label: Unraid version
      placeholder: "7.2.0"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Install method
      options:
        - compose-image
        - compose-build
        - docker-run
        - bot-only
        - Manual
    validations:
      required: true
  - type: checkboxes
    id: parts
    attributes:
      label: Optional parts in use
      options:
        - label: Host helper
        - label: Relay
        - label: Preview page
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw. Add screenshots of the panel if they help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Bot log
      description: |
        For more detail, set `log_level = "debug"` in `config.toml`, restart the bot, and make the problem
        happen again. Then get the log. In the folder that holds `compose.yaml`, run
        `docker compose restart shazzzbot` and `docker compose logs --since 1h shazzzbot`.
        For a `docker-run` or `bot-only` install, run `docker restart shazzzbot` and `docker logs --since 1h shazzzbot`.
        Paste the lines around the problem. They are formatted as code automatically.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: config.toml
      description: The sections that relate to the problem. Never paste `.env`.
      render: toml
  - type: textarea
    id: extra
    attributes:
      label: Anything else
