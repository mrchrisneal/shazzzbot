name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/mrchrisneal/shazzzbot#roadmap) and the open issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do, and what stops you now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
