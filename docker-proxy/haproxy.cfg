# The bot may list containers, read engine info, and restart one; every other Docker API call is refused.
# A path-decoded match stops %2F tricks; ids must start alphanumeric so ".." cannot slip through.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 60s

frontend docker
    bind :2375
    http-request allow if METH_GET { path,url_dec -m reg ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg ^(/v[0-9.]+)?/info$ }
    http-request allow if METH_POST { path,url_dec -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/restart$ }
    http-request deny deny_status 403
    default_backend socket

backend socket
    server docker /var/run/docker.sock
